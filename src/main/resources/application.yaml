server:
  port: 8086
spring:
  config:
    import: "optional:file:./.local/shared.properties,optional:file:../.local/shared.properties,optional:file:./.local/gemini.properties,optional:file:../.local/gemini.properties"
  application:
    name: nihongo-user-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  datasource:
    url: jdbc:mysql://onehost-amdcloudhn022602.000nethost.com:3306/tsezwyvdhosting_nihongo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=15000
    username: tsezwyvdhosting_nihongo_app
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 45000
      keepalive-time: 30000
      idle-timeout: 30000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

gemini:
  access-key: ${gemini.local-api-key:${GEMINI_API_KEY:${gemini.api-key:}}}
  base-url: https://generativelanguage.googleapis.com
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

jwt:
  secret: ${JWT_SECRET}


wallet:
  bank-name: ${WALLET_BANK_NAME:}
  bank-account: ${WALLET_BANK_ACCOUNT:}
  bank-account-name: ${WALLET_BANK_ACCOUNT_NAME:}

  events:
    enabled: ${WALLET_EVENTS_ENABLED:true}
    topic: ${WALLET_EVENTS_TOPIC:wallet.events.v1}
    partitions: ${WALLET_EVENTS_PARTITIONS:3}
    replicas: ${WALLET_EVENTS_REPLICAS:1}
  instance-id: ${WALLET_INSTANCE_ID:${random.uuid}}
  websocket:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}

